<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Cache-busting: bump app version to force reload of local static assets -->
  <meta name="app-version" content="v{{ version }}">
  <title>{% block title %}PassoUm{% endblock %} — European Portuguese A1</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --pu-dark:   #1a1a2e;
      --pu-mid:    #16213e;
      --pu-accent: #f39c12;
      --pu-light:  #f4f6f9;
      --radius:    14px;
    }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--pu-light);
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Navbar ──────────────────────────────────────────────────── */
    .navbar {
      background: linear-gradient(135deg, var(--pu-dark) 0%, var(--pu-mid) 100%);
      box-shadow: 0 2px 12px rgba(0,0,0,.35);
      padding: .65rem 1.5rem;
    }
    .navbar-brand {
      font-weight: 800; font-size: 1.45rem;
      color: #fff !important;
      display: flex; align-items: center; gap: .5rem;
    }
    .nav-link {
      color: rgba(255,255,255,.8) !important;
      font-weight: 600;
      border-radius: 8px;
      padding: .4rem .8rem !important;
      transition: background .15s, color .15s;
    }
    .nav-link:hover, .nav-link.active {
      background: rgba(255,255,255,.1);
      color: #fff !important;
    }

    /* ── Cards ───────────────────────────────────────────────────── */
    .card {
      border: none;
      border-radius: var(--radius);
      box-shadow: 0 3px 16px rgba(0,0,0,.07);
    }

    /* ── Primary button ──────────────────────────────────────────── */
    .btn-pu-primary {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      border: none; color: #fff;
      font-weight: 700; border-radius: 50px;
      padding: .6rem 2rem;
      transition: transform .15s, box-shadow .15s;
    }
    .btn-pu-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(46,204,113,.4);
      color: #fff;
    }

    /* ── Quiz progress bar ───────────────────────────────────────── */
    .quiz-progress .progress {
      height: 9px; border-radius: 20px; background: #dde;
    }
    .quiz-progress .progress-bar {
      background: linear-gradient(90deg, #2ecc71, #27ae60);
      border-radius: 20px; transition: width .4s ease;
    }

    /* ── Footer ──────────────────────────────────────────────────── */
    footer {
      background: var(--pu-dark);
      color: rgba(255,255,255,.5);
      font-size: .78rem;
      text-align: center;
      padding: .9rem;
      margin-top: auto;
    }
    footer .accent { color: var(--pu-accent); }
  </style>

  {% block head_extra %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('index') }}">
      🏰 PassoUm
    </a>
    <button class="navbar-toggler border-0" type="button"
            data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto gap-1 align-items-lg-center">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='index' %}active{% endif %}"
             href="{{ url_for('index') }}">
            <i class="bi bi-house-door-fill"></i> Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ('learn_words','practice','practice_start') %}active{% endif %}"
             href="{{ url_for('learn_words') }}">
            <i class="bi bi-book-fill"></i> Learn
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='exam' %}active{% endif %}"
             href="{{ url_for('exam') }}">
            <i class="bi bi-mortarboard-fill"></i> Exam
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='vocabulary' %}active{% endif %}"
             href="{{ url_for('vocabulary') }}">
            <i class="bi bi-list-columns-reverse"></i> Vocabulary
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="flex-grow-1">
  {% block content %}{% endblock %}
</main>

<footer>
  PassoUm <span class="accent">v{{ version }}</span>
  &nbsp;|&nbsp; Built with ❤️ in Palmela
  &nbsp;|&nbsp; European Portuguese (pt-PT) A1
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
